[package]
name = "spicetify-installer"
version = "0.1.0"
description = "A focused Windows installer for Spicetify"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-opener = "2"
sha2 = "0.10"
tempfile = "3"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
